<!DOCTYPE html>
<html>
<head>
<title>Campus Admin Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginPage" style="text-align:center; padding:50px;">
<h1>Campus Admin Pro</h1>
<h3>Admin Login</h3>
<input id="loginEmail" type="email" placeholder="Email: admin@campus.com"><br><br>
<input id="loginPassword" type="password" placeholder="Password: 123456"><br><br>
<button onclick="login()">Login</button>
<p>Demo: admin@campus.com / 123456</p>
</div>

<div id="mainApp" style="display:none; padding:20px;">
<h1>Dashboard</h1>
<p>Total Students: <span id="totalStudents">0</span></p>
<p>Total Fees: <span id="totalFees">₹0</span></p>
<p>Total Courses: <span id="totalCourses">3</span></p>
<hr>

<h2>Add Student</h2>
<input id="stuName" placeholder="Student Name"><br><br>
<input id="stuEmail" placeholder="Email"><br><br>
<input id="stuCourse" placeholder="Course e.g. B.Tech CSE"><br><br>
<input id="stuFees" type="number" placeholder="Fees"><br><br>
<select id="stuStatus">
<option>Fee: Paid</option>
<option>Fee: Pending</option>
</select><br><br>
<button onclick="addStudent()">Add Student</button>
<hr>

<h2>Students List</h2>
<input id="searchBox" placeholder="Search student..." onkeyup="searchStudent()"><br><br>
<div id="studentList"></div>
</div>

<script src="script.js"></script>
</body>
</html>
